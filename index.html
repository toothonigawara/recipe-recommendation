<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>スワイプで探す | 動画レシピ提案サイト</title>
    <link rel="stylesheet" href="styles.css?v=swipe-prototype-20261006">
  </head>
  <body>
    <main class="app-shell swipe-shell">
      <section class="swipe-stage" aria-labelledby="page-title">
        <div class="site-topbar swipe-topbar">
          <a class="brand-pill" href="index.html">動画レシピ提案サイト</a>
          <a href="conditions.html">条件検索</a>
        </div>

        <header class="swipe-intro">
          <p class="eyebrow">Swipe Prototype</p>
          <h1 id="page-title">今日食べたい料理をスワイプ</h1>
          <p class="lead">
            代表的な料理を見ながら、今の気分に近いものを選んでください。
          </p>
        </header>

        <section class="swipe-workspace" aria-label="代表料理スワイプ">
          <div class="swipe-progress" aria-live="polite">
            <span id="swipeProgressText">1 / 8</span>
            <div class="swipe-progress-bar" aria-hidden="true">
              <span id="swipeProgressBar"></span>
            </div>
          </div>

          <div class="swipe-card-area" id="swipeCardArea">
            <article class="swipe-card" id="swipeCard" aria-live="polite">
              <div class="swipe-choice-label swipe-choice-like" aria-hidden="true">食べたい</div>
              <div class="swipe-choice-label swipe-choice-dislike" aria-hidden="true">今じゃない</div>
              <img id="swipeDishImage" alt="">
              <div class="swipe-card-body">
                <p class="swipe-card-kicker" id="swipeDishMeta"></p>
                <h2 id="swipeDishName"></h2>
              </div>
            </article>
          </div>

          <div class="swipe-actions" aria-label="回答操作">
            <button class="swipe-action swipe-dislike-button" id="swipeDislikeButton" type="button">今じゃない</button>
            <button class="swipe-action swipe-like-button" id="swipeLikeButton" type="button">食べたい</button>
          </div>

          <section class="swipe-complete" id="swipeComplete" hidden>
            <p class="section-kicker">Analyzing</p>
            <h2>今日のおすすめを探しています</h2>
            <p>ここに後から、スワイプ結果に近い実在YouTubeレシピを表示します。</p>
            <div class="swipe-complete-actions">
              <button class="primary-action" id="swipeResultButton" type="button">結果を見る</button>
              <button class="secondary-action" id="swipeRestartButton" type="button">もう一度試す</button>
            </div>
          </section>
        </section>

        <details class="swipe-debug" id="swipeDebug">
          <summary>開発用: スワイプ結果</summary>
          <pre id="swipeDebugOutput">[]</pre>
        </details>
      </section>
    </main>

    <script src="swipe-dishes.js?v=swipe-prototype-20261006"></script>
    <script src="swipe.js?v=swipe-prototype-20261006"></script>
  </body>
</html>
